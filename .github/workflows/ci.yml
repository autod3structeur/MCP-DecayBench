name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install pytest
      - name: Run tests (corpus integrity + fixture servers + scoring)
        run: python -m pytest harness/test_benchmark.py -q
      - name: Run reference benchmark (no external scanners)
        run: python -m harness.run --scanner reference-keyword
